<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LLM Q&A System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>LLM Question & Answer System</h1>

    <form method="POST" action="/">
        <label>Ask a Question:</label>
        <textarea name="question" placeholder="Type any natural-language question..."></textarea>
        <button type="submit">Ask LLM</button>
    </form>

    {% if processed_question %}
    <div class="result-box">
        <div class="result-title">Processed Question:</div>
        <div class="result-text">{{ processed_question }}</div>
    </div>
    {% endif %}

    {% if answer %}
    <div class="result-box">
        <div class="result-title">Answer:</div>
        <div class="result-text">{{ answer }}</div>
    </div>
    {% endif %}

    <div class="footer">Powered by OpenAI API</div>
</div>

</body>
</html>
